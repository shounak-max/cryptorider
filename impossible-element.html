<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impossible Element</title>
    <style>
      :root {
        --bg-0: #04020c;
        --bg-1: #120424;
        --bg-2: #001225;
        --glow-a: #8a5cff;
        --glow-b: #2dd4ff;
        --glow-c: #ff2dcf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Segoe UI", Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 30% 20%, #19083a 0%, transparent 42%),
          radial-gradient(circle at 80% 70%, #032843 0%, transparent 40%),
          linear-gradient(145deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
        color: #edf4ff;
      }

      .stage {
        position: relative;
        width: min(88vw, 760px);
        aspect-ratio: 1 / 1;
        border-radius: 28px;
        isolation: isolate;
        transform-style: preserve-3d;
        perspective: 1100px;
      }

      .void-core {
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 30%, #ffffff80 0, #ffffff05 15%, transparent 45%),
          conic-gradient(
            from 0deg,
            var(--glow-a),
            var(--glow-b),
            var(--glow-c),
            var(--glow-a)
          );
        filter: blur(1px) saturate(1.2);
        animation: spin 9s linear infinite;
        box-shadow: 0 0 45px #9f84ffaa, 0 0 120px #2dd4ff66, 0 0 160px #ff2dcf55;
      }

      .void-core::before,
      .void-core::after {
        content: "";
        position: absolute;
        inset: 10%;
        border-radius: 50%;
      }

      .void-core::before {
        background: radial-gradient(circle, #000 30%, #0a0018 62%, transparent 66%);
        box-shadow: inset 0 0 40px #8f79ff33;
      }

      .void-core::after {
        inset: 0;
        background: repeating-conic-gradient(
          from 0deg,
          #fff0 0deg 8deg,
          #ffffff2b 8deg 10deg,
          #fff0 10deg 16deg
        );
        mix-blend-mode: screen;
        animation: spin-rev 13s linear infinite;
        opacity: 0.6;
      }

      .ring {
        position: absolute;
        inset: 10%;
        border: 1px solid #95d5ff70;
        border-radius: 50%;
        transform-style: preserve-3d;
      }

      .ring.r1 {
        transform: rotateX(75deg) rotateY(8deg);
        box-shadow: 0 0 28px #6f8bff66;
        animation: wobble-a 5.8s ease-in-out infinite;
      }

      .ring.r2 {
        transform: rotateY(75deg) rotateX(8deg);
        border-color: #ff8df370;
        box-shadow: 0 0 28px #ff56db4d;
        animation: wobble-b 6.4s ease-in-out infinite;
      }

      .ring.r3 {
        inset: 5%;
        transform: rotateX(20deg) rotateY(65deg);
        border-color: #9bffe470;
        box-shadow: 0 0 24px #1ce7cc66;
        animation: wobble-c 7.1s ease-in-out infinite;
      }

      .grain {
        position: absolute;
        inset: -30%;
        background-image: radial-gradient(#ffffff26 0.8px, transparent 0.8px);
        background-size: 4px 4px;
        mix-blend-mode: soft-light;
        animation: drift 22s linear infinite;
        opacity: 0.35;
        pointer-events: none;
      }

      .caption {
        position: absolute;
        left: 50%;
        bottom: -8%;
        transform: translateX(-50%);
        text-transform: uppercase;
        letter-spacing: 0.35em;
        font-size: clamp(0.62rem, 1.5vw, 0.82rem);
        opacity: 0.86;
        white-space: nowrap;
      }

      .caption strong {
        color: #b2dcff;
        text-shadow: 0 0 20px #7f88ff66;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spin-rev {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes wobble-a {
        0%,
        100% {
          transform: rotateX(75deg) rotateY(8deg);
        }
        50% {
          transform: rotateX(79deg) rotateY(-10deg);
        }
      }

      @keyframes wobble-b {
        0%,
        100% {
          transform: rotateY(75deg) rotateX(8deg);
        }
        50% {
          transform: rotateY(80deg) rotateX(-12deg);
        }
      }

      @keyframes wobble-c {
        0%,
        100% {
          transform: rotateX(20deg) rotateY(65deg);
        }
        50% {
          transform: rotateX(32deg) rotateY(74deg);
        }
      }

      @keyframes drift {
        from {
          transform: translate(-4%, -3%);
        }
        to {
          transform: translate(5%, 4%);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="grain"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="void-core"></div>
      <p class="caption">Perception Engine <strong>V∞</strong></p>
    </div>

    <script>
      const stage = document.getElementById("stage");

      window.addEventListener("pointermove", (event) => {
        const x = event.clientX / window.innerWidth - 0.5;
        const y = event.clientY / window.innerHeight - 0.5;
        const rx = y * -18;
        const ry = x * 22;

        stage.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.01)`;
      });

      window.addEventListener("pointerleave", () => {
        stage.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
      });
    </script>
  </body>
</html>
